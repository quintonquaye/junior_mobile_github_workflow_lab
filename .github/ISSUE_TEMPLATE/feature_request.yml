name: Feature request
description: Propose a small, testable improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user need
      description: What user or developer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Expected behavior
      description: Describe the outcome, not just an implementation idea.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test ideas
      description: Include success, boundary, and failure cases where relevant.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What is intentionally not included?
    validations:
      required: false
